services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: teampilot-postgres
    environment:
      POSTGRES_DB: teampilot
      POSTGRES_USER: teampilot
      POSTGRES_PASSWORD: teampilot_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teampilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: