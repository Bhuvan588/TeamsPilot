spring:

  profiles:
    default: local

  application:
    name: teampilot-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/teampilot
    username: teampilot
    password: ${DB_PASSWORD:teampilot_local}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.3
      embedding:
        options:
          model: nomic-embed-text

    # IMPORTANT: vectorstore is a sibling of ollama
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always